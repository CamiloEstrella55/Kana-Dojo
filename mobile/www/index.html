<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no"
    />
    <title>KanaDojo</title>
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0b0b0f;
        color: #e7e7ea;
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      .wrap {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.25rem;
        padding: env(safe-area-inset-top) 1.5rem env(safe-area-inset-bottom);
        text-align: center;
      }
      .logo {
        font-size: 2rem;
        font-weight: 700;
        letter-spacing: 0.02em;
      }
      .logo span {
        opacity: 0.6;
      }
      .spinner {
        width: 34px;
        height: 34px;
        border: 3px solid rgba(255, 255, 255, 0.18);
        border-top-color: #e7e7ea;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      .hint {
        font-size: 0.85rem;
        opacity: 0.55;
        max-width: 22rem;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="logo">仮名<span> · KanaDojo</span></div>
      <div class="spinner" role="status" aria-label="Loading"></div>
      <div class="hint">
        Loading your dojo… If this screen persists, check your connection.
      </div>
    </div>
  </body>
</html>

name: iOS IPA

# Builds an .ipa of the KanaDojo Capacitor app.
#
# If the signing secrets below are set, the IPA is SIGNED with your certificate
# + provisioning profile and can be installed on the device(s) listed in the
# profile — e.g. hosted on installonair.com for over-the-air install, or through
# AltStore / SideStore. If the secrets are absent, an UNSIGNED IPA is produced
# instead (for signing later).
#
# ── Required repo secrets for a SIGNED build ──────────────────────────────────
# (Settings → Secrets and variables → Actions → New repository secret)
#
#   IOS_CERTIFICATE_P12_BASE64        base64 of your signing certificate (.p12)
#   IOS_CERTIFICATE_PASSWORD          the password set on that .p12
#   IOS_PROVISIONING_PROFILE_BASE64   base64 of your .mobileprovision
#
# The app's bundle id is rewritten to match the profile automatically, so the
# profile does NOT need to be for `com.kanadojo.app` — any explicit app id works.
#   • Enterprise / signing-service profile (ProvisionsAllDevices = true):
#     installs on any device, no UDID needed, valid ~1 year. Nothing to refresh
#     until the cert/profile expires (or the service revokes it).
#   • Free Apple ID profile: must include your iPhone's UDID and expires after
#     7 days — regenerate, re-encode, and update IOS_PROVISIONING_PROFILE_BASE64
#     when it does. The certificate itself is valid ~1 year.
#
# You do NOT need to add your Apple ID password. Signing uses only the cert +
# profile above.
#
# Encode a file to base64 for the secret value:
#   Windows PowerShell:
#     [Convert]::ToBase64String([IO.File]::ReadAllBytes("cert.p12")) | Set-Clipboard
#   macOS/Linux:
#     base64 -i cert.p12 | pbcopy
#
# Manual only — run it from the Actions tab (Run workflow).
on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build on-device static bundle (./out)
        run: npm run build:mobile
        env:
          # Baked into the bundle so auth + sync work offline. Add these as repo
          # secrets (Settings → Secrets and variables → Actions).
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Capacitor sync (iOS)
        run: npx cap sync ios

      - name: Archive (unsigned)
        working-directory: ios/App
        run: |
          set -euo pipefail
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -skipPackagePluginValidation \
            clean archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM=""

      - name: Detect signing secrets
        id: signing
        env:
          P12: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          if [ -n "$P12" ] && [ -n "$PROFILE" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Signing secrets found — producing a SIGNED IPA."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Signing secrets not set — producing an UNSIGNED IPA."
          fi

      - name: Sign the app
        if: steps.signing.outputs.enabled == 'true'
        env:
          P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app"
          [ -d "$APP" ] || { echo "App.app not found in archive" >&2; exit 1; }

          # --- Decode the provided certificate and profile ---
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          echo "$PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"

          # --- Import the certificate into a temporary, ephemeral keychain ---
          KEYCHAIN="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PW="$(openssl rand -base64 24)"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PW" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | sed 's/"//g')

          # --- Resolve the signing identity that came with the .p12 ---
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | awk -F '"' 'NR==1{print $2}')"
          [ -n "$IDENTITY" ] || { echo "No code-signing identity found in the .p12" >&2; exit 1; }
          echo "Signing identity: $IDENTITY"

          # --- Extract entitlements + app id from the provisioning profile ---
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          /usr/libexec/PlistBuddy -x -c 'Print :Entitlements' "$RUNNER_TEMP/profile.plist" > "$RUNNER_TEMP/entitlements.plist"
          PROFILE_APPID_FULL="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$RUNNER_TEMP/profile.plist")"
          PROFILE_APP_ID="${PROFILE_APPID_FULL#*.}"   # drop the "<TEAMID>." prefix
          APP_BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")"
          echo "App bundle id  : $APP_BUNDLE_ID"
          echo "Profile app id : $PROFILE_APP_ID"

          # The app's bundle id MUST match the profile's app id, or iOS refuses
          # to install. Explicit-app-id profiles (common with enterprise / paid
          # signing services) are bound to one id — rewrite the app to match so
          # the same profile signs any app. Wildcard profiles ("*") need no change.
          if [ "$PROFILE_APP_ID" != "*" ] && [ "$PROFILE_APP_ID" != "$APP_BUNDLE_ID" ]; then
            echo "Rewriting app bundle id to match the profile: $APP_BUNDLE_ID -> $PROFILE_APP_ID"
            /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier $PROFILE_APP_ID" "$APP/Info.plist"
            APP_BUNDLE_ID="$PROFILE_APP_ID"
          fi

          # --- Embed the profile and re-sign (nested code first, then the app) ---
          cp "$RUNNER_TEMP/profile.mobileprovision" "$APP/embedded.mobileprovision"

          if [ -d "$APP/Frameworks" ]; then
            find "$APP/Frameworks" -maxdepth 1 \( -name '*.framework' -o -name '*.dylib' \) -print0 |
              while IFS= read -r -d '' item; do
                echo "Signing $item"
                codesign --force --timestamp=none --keychain "$KEYCHAIN" --sign "$IDENTITY" "$item"
              done
          fi

          if [ -d "$APP/PlugIns" ]; then
            find "$APP/PlugIns" -maxdepth 1 -name '*.appex' -print0 |
              while IFS= read -r -d '' ext; do
                echo "Signing $ext"
                codesign --force --timestamp=none --keychain "$KEYCHAIN" \
                  --entitlements "$RUNNER_TEMP/entitlements.plist" --sign "$IDENTITY" "$ext"
              done
          fi

          codesign --force --timestamp=none --keychain "$KEYCHAIN" \
            --entitlements "$RUNNER_TEMP/entitlements.plist" --sign "$IDENTITY" "$APP"

          # --- Verify the signature ---
          codesign --verify --deep --strict --verbose=2 "$APP"
          echo "App signed and verified."

      - name: Package IPA
        id: package
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app"
          [ -d "$APP" ] || { echo "App.app not found in archive" >&2; exit 1; }
          if [ "${{ steps.signing.outputs.enabled }}" = "true" ]; then
            NAME="KanaDojo-signed"
          else
            NAME="KanaDojo-unsigned"
          fi
          WORK="$RUNNER_TEMP/ipa"
          mkdir -p "$WORK/Payload"
          cp -R "$APP" "$WORK/Payload/App.app"
          (cd "$WORK" && zip -qry "$RUNNER_TEMP/$NAME.ipa" Payload)
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "Built: $RUNNER_TEMP/$NAME.ipa"
          ls -lh "$RUNNER_TEMP/$NAME.ipa"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}-ipa
          path: ${{ runner.temp }}/${{ steps.package.outputs.name }}.ipa
          if-no-files-found: error
          retention-days: 1

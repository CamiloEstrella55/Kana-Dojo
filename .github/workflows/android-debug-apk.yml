name: Android Debug APK

# Builds a debug (debug-signed) Android APK of the KanaDojo Capacitor app and
# uploads it as an artifact. Debug APKs install directly on any device with
# "install from unknown sources" enabled — handy for testing on real hardware.

# Manual only — runs when you trigger it from the Actions tab (Run workflow).
on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Generate commit info
        run: node scripts/generate-commit-info.mjs

      - name: Capacitor sync (Android)
        run: npx cap sync android
        env:
          CAP_SERVER_URL: ${{ vars.CAP_SERVER_URL || 'https://kanadojo.com' }}

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: KanaDojo-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 1
